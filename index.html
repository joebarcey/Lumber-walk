<style>
/* Layout: fixed 600x600 screen, black ground (black is see-through on the display), one standard per screen, big targets, arrow keys + Enter + Escape only. */
:root {
  --bg: #000;
  --fg: #fff;
  --dim: #b9c3d3;
  --line: #8d9ab0;
  --blue: #7bbcff;
  --green: #4df08c;
  --amber: #ffc43a;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
html, body { margin: 0; width: 600px; height: 600px; overflow: hidden; }
body { margin: 0 auto; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 24px; line-height: 1.2; }
#app { width: 600px; height: 600px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
button { font: inherit; color: inherit; background: var(--bg); border: 3px solid var(--line); border-radius: 14px; padding: 0 10px; margin: 0; cursor: pointer; -webkit-appearance: none; appearance: none; text-align: center; }
button:disabled { opacity: .35; }
.focusable:focus, .focusable.focused { outline: 6px solid var(--fg); outline-offset: 2px; background: #1c2b47; }
.on:focus, .on.focused { background: inherit; }
.b { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }

/* home */
.bar { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; }
.ttl { display: grid; gap: 2px; min-width: 0; }
.ttl b { font-size: 28px; line-height: 1; white-space: nowrap; }
.ttl span { font-size: 22px; color: var(--dim); line-height: 1; }
.prog { font-size: 34px; font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; padding-right: 6px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 92px; gap: 8px; flex: none; }
.tile { display: grid; align-content: center; justify-items: center; gap: 2px; padding: 4px; }
.tile .n { font-size: 21px; font-weight: 700; line-height: 1.05; }
.tile .c { font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .f { font-size: 19px; font-weight: 700; color: var(--amber); line-height: 1; }
.tile.done { border-color: var(--green); } .tile.done .c, .tile.done .n { color: var(--green); }
.tile.flag { border-color: var(--amber); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 80px; flex: none; }
.row2 button { font-size: 28px; }
.go { border-color: var(--green); color: var(--green); }

/* card */
.top { height: 64px; display: flex; align-items: center; gap: 12px; flex: none; }
.top .b { width: 150px; height: 64px; font-size: 26px; }
.crumb { flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 26px; font-weight: 700; }
.crumb span { color: var(--blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.body { flex: 1; min-height: 0; display: flex; align-items: center; padding: 4px 6px; }
.std { margin: 0; font-weight: 600; line-height: 1.22; overflow-wrap: anywhere; }
.acts { display: grid; grid-template-columns: 150px 1fr 1fr; gap: 8px; height: 104px; flex: none; }
.acts .b { font-size: 34px; }
.acts .prev { font-size: 26px; }
.met { border-color: var(--green); color: var(--green); }
.no { border-color: var(--amber); color: var(--amber); }
.met.on { background: var(--green); color: #000; }
.no.on { background: var(--amber); color: #000; }

/* summary */
.stats { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 24px; font-weight: 700; line-height: 1.1; }
.stats .g { color: var(--green); } .stats .a { color: var(--amber); } .stats .d { color: var(--dim); }
.list { display: grid; grid-auto-rows: 92px; gap: 6px; flex: none; }
.item { display: flex; align-items: center; gap: 12px; text-align: left; padding: 6px 12px; overflow: hidden; }
.item .dot { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--amber); }
.item.un .dot { background: transparent; border: 3px solid var(--dim); }
.item .t { min-width: 0; display: grid; gap: 2px; }
.item small { font-size: 18px; font-weight: 700; color: var(--amber); text-transform: uppercase; letter-spacing: .05em; }
.item.un small { color: var(--dim); }
.item span { font-size: 22px; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.allmet { flex: 1; display: grid; place-items: center; text-align: center; font-size: 40px; font-weight: 700; color: var(--green); line-height: 1.15; }
.nav { display: grid; grid-template-columns: 1fr auto 1fr 1fr; align-items: center; gap: 8px; height: 76px; flex: none; margin-top: auto; }
.nav button { height: 76px; font-size: 24px; }
.nav .pg { font-size: 24px; color: var(--dim); text-align: center; min-width: 78px; font-variant-numeric: tabular-nums; }
.nav .reset.sure { border-color: var(--amber); color: var(--amber); }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var SECTIONS = [
    { id: "per", name: "Perimeter", items: [
      "All product is security-stacked.",
      "No block is outside; all block is in topstock.",
      "No treated lumber is outside; all treated lumber is in the bullpen or indoors.",
      "No trash or debris."] },
    { id: "can", name: "Pro Canopy", items: [
      "Lumber bunks are filled.",
      "Pickets are filled.",
      "All concrete is filled.",
      "All pricing is correct.",
      "Sign fixtures are aligned and undamaged.",
      "The canopy is blown out and the perimeter is swept.",
      "Trash cans are emptied and wiped down.",
      "Squeegee, washer fluid, and paper towels are filled.",
      "The loader cart and cabinet are stocked and clean.",
      "The lumber cull cart is at least 50% full.",
      "Nothing on Register 1."] },
    { id: "dry", name: "Drywall", items: [
      "All bumpers are in place.",
      "The 2 x 2 patch sidestack is in place; panels are undamaged and pricing is present.",
      "At least two lifts of every drywall type are available in the home.",
      "Drywall tools and accessories are zoned.",
      "All aisles are swept.",
      "A trash can is nearby.",
      "No paper strips or drywall dividers are on the ground."] },
    { id: "a1852", name: "Aisle 18/52", items: [
      "Every home has a job-lot quantity or more.",
      "All product is pulled forward.",
      "All bays are swept out.",
      "Decking sidestacks are in their proper locations and full.",
      "J-hooks are full.",
      "There are no empty spaces in topstock.",
      "All homes are culled.",
      "Lumber carts are aligned."] },
    { id: "a17", name: "Aisle 17", items: [
      "All sheet-goods homes are above 50% full.",
      "No cull sheets are on rail carts; all cull sheets are in the homes.",
      "Deck accessories are zoned.",
      "Wooden stringers and balusters are filled.",
      "Sidestacks are aligned and filled, with no more than five.",
      "J-hooks are full.",
      "Lumber carts are aligned."] },
    { id: "a51", name: "Aisle 51", items: [
      "1-by material is zoned and culled daily.",
      "The soffit cart contains soffit only.",
      "Downspout accessories are zoned.",
      "Sidestacks are aligned.",
      "Lumber carts are aligned.",
      "No more than 3 PUIS carts are staged in the aisle."] },
    { id: "a16", name: "Aisle 16", items: [
      "There are no open spaces in topstock.",
      "There are no damaged pallets in topstock.",
      "All homes are at least 50% full.",
      "Accessories are zoned.",
      "Sidestacks are aligned and filled.",
      "J-hooks are full.",
      "There are no damaged bags on the floor.",
      "The aisle is swept or mopped as needed.",
      "Lumber carts are aligned."] },
    { id: "a50", name: "Aisle 50", items: [
      "There are no ripped packages of shingles.",
      "Sidestacks are aligned and full.",
      "J-hooks are full.",
      "All shingle and driveway-sealer homes are above 50% full.",
      "There are no open spaces in topstock.",
      "All roof panels have job-lot quantities or more.",
      "Lumber carts are aligned."] },
    { id: "a15", name: "Aisle 15", items: [
      "There is no product on the ground.",
      "All security cables are up.",
      "J-hooks are full.",
      "There are no sidestacks."] },
    { id: "a49", name: "Aisle 49", items: [
      "All insulation homes are above 50% full.",
      "All security cables are up.",
      "All insulation is out of the shipping plastic.",
      "J-hooks are filled.",
      "Sidestacks are aligned.",
      "All Great Stuff homes are full."] },
    { id: "end", name: "Endcaps", items: [
      "J-hooks are full.",
      "There are no outs.",
      "Grab and Goes are filled."] },
    { id: "bull", name: "Bullpen", items: [
      "All orders out back are current.",
      "The bullpen is swept.",
      "The hopper and trash are empty.",
      "The door is not blocked.",
      "All orders are current and are not staged in front of the lumber.",
      "Cancelled orders are put away.",
      "The gate is locked.",
      "No bunks of 196087 or 552328."] }
  ];

  var ITEM = {}, ORDER = [], ZOF = {};
  SECTIONS.forEach(function (s, zi) {
    s.ids = s.items.map(function (t, i) {
      var id = s.id + "-" + i;
      ITEM[id] = { id: id, text: t, zi: zi, i: i };
      ORDER.push(id);
      return id;
    });
  });
  var TOTAL = ORDER.length;
  var DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
  var PAGE = 4;

  function pad(n) { return String(n).padStart(2, "0"); }
  var now = new Date();
  var S = {
    view: "home",
    date: now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()),
    label: DAYS[now.getDay()] + " " + (now.getMonth() + 1) + "/" + now.getDate(),
    zone: 0, idx: 0, origin: "home", page: 0, confirm: false, focus: null, st: {}
  };

  function key() { return "plw-g:" + S.date; }
  function load() {
    S.st = {};
    try { var v = localStorage.getItem(key()); if (v) S.st = JSON.parse(v) || {}; } catch (e) {}
  }
  function save() { try { localStorage.setItem(key(), JSON.stringify(S.st)); } catch (e) {} }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  function counts(z) {
    var met = 0, no = 0;
    z.ids.forEach(function (id) { if (S.st[id] === "y") met++; else if (S.st[id] === "n") no++; });
    return { met: met, no: no, ans: met + no, n: z.ids.length };
  }
  function totals() {
    var met = 0, no = 0;
    ORDER.forEach(function (id) { if (S.st[id] === "y") met++; else if (S.st[id] === "n") no++; });
    return { met: met, no: no, left: TOTAL - met - no };
  }
  function firstOpen(z) {
    for (var i = 0; i < z.ids.length; i++) if (!S.st[z.ids[i]]) return i;
    return 0;
  }

  /* ---------- views ---------- */
  function home() {
    var t = totals();
    var tiles = SECTIONS.map(function (z, i) {
      var c = counts(z);
      var cls = c.no ? " flag" : (c.met === c.n ? " done" : "");
      return '<button class="focusable tile' + cls + '" data-k="z:' + i + '"><span class="n">' + esc(z.name) + '</span><span class="c">' + c.ans + '/' + c.n + '</span>' +
        (c.no ? '<span class="f">' + c.no + ' NOT MET</span>' : '') + '</button>';
    }).join("");
    return '<div class="bar"><div class="ttl"><b>Pro &amp; Lumber</b><span>' + esc(S.label) + '</span></div>' +
      '<div class="prog">' + (t.met + t.no) + '/' + TOTAL + '</div></div>' +
      '<div class="grid">' + tiles + '</div>' +
      '<div class="row2"><button class="focusable b go" data-k="cont">' + (t.left ? 'Continue' : 'All checked') + '</button>' +
      '<button class="focusable b" data-k="sum">Summary</button></div>';
  }

  function card() {
    var z = SECTIONS[S.zone], id = z.ids[S.idx], v = S.st[id], txt = ITEM[id].text;
    var fs = txt.length > 70 ? 32 : txt.length > 45 ? 36 : 40;
    return '<div class="top"><button class="focusable b" data-k="back">Back</button>' +
      '<div class="crumb"><span>' + esc(z.name) + '</span><b>' + (S.idx + 1) + ' / ' + z.ids.length + '</b></div></div>' +
      '<div class="body"><p class="std" style="font-size:' + fs + 'px">' + esc(txt) + '</p></div>' +
      '<div class="acts"><button class="focusable b prev" data-k="prev">Prev</button>' +
      '<button class="focusable b met' + (v === "y" ? " on" : "") + '" data-k="y">Met</button>' +
      '<button class="focusable b no' + (v === "n" ? " on" : "") + '" data-k="n">Not met</button></div>';
  }

  function sumList() {
    var no = [], un = [];
    ORDER.forEach(function (id) { var v = S.st[id]; if (v === "n") no.push(id); else if (v !== "y") un.push(id); });
    return no.concat(un);
  }

  function summary() {
    var t = totals(), list = sumList(), pages = Math.max(1, Math.ceil(list.length / PAGE));
    if (S.page > pages - 1) S.page = pages - 1;
    var rows = list.slice(S.page * PAGE, S.page * PAGE + PAGE).map(function (id) {
      var it = ITEM[id], un = S.st[id] !== "n";
      return '<button class="focusable item' + (un ? " un" : "") + '" data-k="r:' + id + '"><i class="dot"></i><div class="t"><small>' +
        esc(SECTIONS[it.zi].name) + (un ? ' · not checked' : ' · not met') + '</small><span>' + esc(it.text) + '</span></div></button>';
    }).join("");
    var body = list.length ? '<div class="list">' + rows + '</div>' :
      '<div class="allmet">All ' + TOTAL + ' standards met</div>';
    return '<div class="top"><button class="focusable b" data-k="back">Back</button>' +
      '<div class="stats"><span class="g">' + t.met + ' met</span><span class="a">' + t.no + ' not met</span><span class="d">' + t.left + ' left</span></div></div>' +
      body +
      '<div class="nav"><button class="focusable b" data-k="pp"' + (S.page === 0 ? " disabled" : "") + '>Prev</button>' +
      '<span class="pg">' + (S.page + 1) + '/' + pages + '</span>' +
      '<button class="focusable b" data-k="np"' + (S.page >= pages - 1 ? " disabled" : "") + '>Next</button>' +
      '<button class="focusable b reset' + (S.confirm ? " sure" : "") + '" data-k="reset">' + (S.confirm ? "Sure?" : "Reset") + '</button></div>';
  }

  var app = document.getElementById("app");
  function render() {
    app.innerHTML = S.view === "home" ? home() : S.view === "card" ? card() : summary();
    var want = S.focus, el = null;
    S.focus = null;
    if (want) el = app.querySelector('[data-k="' + want + '"]:not(:disabled)');
    if (!el) {
      var def = S.view === "home" ? "cont" : S.view === "card" ? (S.origin !== "sum" && S.st[SECTIONS[S.zone].ids[S.idx]] === "n" ? "n" : "y") : "back";
      el = app.querySelector('[data-k="' + def + '"]:not(:disabled)') || app.querySelector(".focusable:not(:disabled)");
      if (S.view === "sum") { var r = app.querySelector(".item"); if (r) el = r; }
    }
    if (el) el.focus();
  }

  /* ---------- actions ---------- */
  function openItem(id, origin) {
    var it = ITEM[id];
    S.zone = it.zi; S.idx = it.i; S.origin = origin; S.view = "card"; S.confirm = false;
  }
  function goBack() {
    S.confirm = false;
    if (S.view === "card") {
      var id = SECTIONS[S.zone].ids[S.idx];
      if (S.origin === "sum") { S.view = "sum"; S.focus = "r:" + id; }
      else { S.view = "home"; S.focus = "z:" + S.zone; }
    } else if (S.view === "sum") { S.view = "home"; S.focus = "sum"; }
    render();
  }
  function choose(v) {
    var z = SECTIONS[S.zone], id = z.ids[S.idx];
    S.st[id] = v; save();
    if (S.origin === "sum") {
      var list = sumList(), pos = list.indexOf(id);
      S.view = "sum";
      if (pos < 0) {
        /* item left the list; keep the same slot */
        var slot = Math.min(S.page * PAGE, Math.max(0, list.length - 1));
        S.focus = list.length ? "r:" + list[Math.min(slot + 0, list.length - 1)] : "back";
      } else S.focus = "r:" + id;
      render(); return;
    }
    if (S.idx < z.ids.length - 1) { S.idx++; S.focus = null; }
    else { S.view = "home"; S.focus = S.zone < SECTIONS.length - 1 ? "z:" + (S.zone + 1) : "sum"; }
    render();
  }

  function act(k) {
    if (k.indexOf("z:") === 0) { S.zone = +k.slice(2); S.idx = firstOpen(SECTIONS[S.zone]); S.origin = "home"; S.view = "card"; render(); return; }
    if (k === "cont") {
      for (var i = 0; i < ORDER.length; i++) if (!S.st[ORDER[i]]) { openItem(ORDER[i], "home"); render(); return; }
      S.view = "sum"; S.page = 0; render(); return;
    }
    if (k === "sum") { S.view = "sum"; S.page = 0; S.confirm = false; render(); return; }
    if (k === "back") { goBack(); return; }
    if (k === "prev") { if (S.idx > 0) { S.idx--; render(); } else goBack(); return; }
    if (k === "y" || k === "n") { choose(k); return; }
    if (k === "pp") { S.page = Math.max(0, S.page - 1); S.focus = "np"; render(); return; }
    if (k === "np") { S.page++; S.focus = "np"; render(); return; }
    if (k.indexOf("r:") === 0) { openItem(k.slice(2), "sum"); render(); return; }
    if (k === "reset") {
      if (!S.confirm) { S.confirm = true; S.focus = "reset"; render(); return; }
      S.st = {}; save(); S.confirm = false; S.view = "home"; S.focus = "cont"; render();
    }
  }

  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-k]");
    if (b && !b.disabled) act(b.getAttribute("data-k"));
  });

  /* ---------- key navigation: arrows move focus, Enter presses, Escape goes back ---------- */
  function move(dir) {
    var els = [].slice.call(app.querySelectorAll(".focusable:not(:disabled)"));
    var cur = document.activeElement;
    if (els.indexOf(cur) < 0) { if (els[0]) els[0].focus(); return; }
    var c = cur.getBoundingClientRect(), best = null, bs = 1e9;
    els.forEach(function (e) {
      if (e === cur) return;
      var r = e.getBoundingClientRect(), main, cross, over;
      if (dir === "ArrowDown") { main = r.top - c.bottom; over = Math.min(r.right, c.right) - Math.max(r.left, c.left); cross = over > 0 ? 0 : -over; }
      else if (dir === "ArrowUp") { main = c.top - r.bottom; over = Math.min(r.right, c.right) - Math.max(r.left, c.left); cross = over > 0 ? 0 : -over; }
      else if (dir === "ArrowRight") { main = r.left - c.right; over = Math.min(r.bottom, c.bottom) - Math.max(r.top, c.top); cross = over > 0 ? 0 : -over; }
      else { main = c.left - r.right; over = Math.min(r.bottom, c.bottom) - Math.max(r.top, c.top); cross = over > 0 ? 0 : -over; }
      if (main < -4 || cross > 0) return;
      var dx = (r.left + r.width / 2) - (c.left + c.width / 2), dy = (r.top + r.height / 2) - (c.top + c.height / 2);
      var s = Math.max(main, 0) + Math.sqrt(dx * dx + dy * dy) * 0.01;
      if (s < bs) { bs = s; best = e; }
    });
    if (best) best.focus();
  }

  document.addEventListener("keydown", function (ev) {
    var k = ev.key;
    if (k === "ArrowUp" || k === "ArrowDown" || k === "ArrowLeft" || k === "ArrowRight") { ev.preventDefault(); move(k); }
    else if (k === "Enter") {
      var a = document.activeElement;
      if (a && a.classList && a.classList.contains("focusable")) { ev.preventDefault(); if (!ev.repeat && !a.disabled) a.click(); }
    }
    else if (k === "Escape" || k === "Backspace") {
      if (S.view !== "home") { ev.preventDefault(); goBack(); }
    }
  });

  /* keep a focused control if the glasses drop focus */
  document.addEventListener("focusout", function () {
    setTimeout(function () {
      if (!document.activeElement || document.activeElement === document.body) {
        var el = app.querySelector(".focusable:not(:disabled)"); if (el) el.focus();
      }
    }, 0);
  });

  load();
  render();
})();
</script>
</body>
</html>
